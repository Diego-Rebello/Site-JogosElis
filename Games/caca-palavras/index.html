<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Encontre palavras escondidas em seis temas, no celular, tablet ou computador."><meta property="og:title" content="Caça-Palavras — Jogos da Elis"><meta property="og:description" content="Caça-palavras educativo com seis temas e três desafios."><meta name="theme-color" content="#ff69b4"><title>Caça-Palavras</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icones/icone-192.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8E%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="../../shared/base.css"><script type="module" src="../../shared/pwa.js"></script><style>
  .jogo{max-width:920px;text-align:center}.tela[hidden]{display:none}.escolhas{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}.escolha{min-height:64px}.escolha[aria-pressed="true"]{background:var(--cor-principal-profunda);color:#fff}.instrucao{font-family:var(--fonte-leitura);color:var(--cor-suave)}.area{display:grid;grid-template-columns:minmax(280px,1fr) minmax(170px,.45fr);gap:20px;align-items:start}.grade{display:grid;aspect-ratio:1;max-width:570px;width:100%;margin:auto;touch-action:none;user-select:none;-webkit-user-select:none}.celula{display:grid;place-items:center;border:1px solid #dfb4c5;background:#fff;font-size:clamp(.8rem,3vw,1.3rem);line-height:1;min-width:0;padding:0;font-family:var(--fonte-corpo);color:var(--cor-texto);cursor:pointer}.celula.selecionada{background:#ffe082}.celula.encontrada{background:#9ee6bc;color:#174c2e}.lista{display:grid;grid-template-columns:1fr;gap:8px;text-align:left}.palavra{font-family:var(--fonte-leitura);font-weight:700;padding:5px}.palavra.encontrada{text-decoration:line-through;color:var(--cor-certo)}.acoes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.progresso{width:100%;height:14px;accent-color:var(--cor-principal)}
  @media(max-width:650px){.jogo{padding:15px 9px}.area{grid-template-columns:1fr}.lista{grid-template-columns:repeat(2,1fr)}.celula{font-size:clamp(.66rem,3.3vw,1rem)}}
  .botao.escolha{min-height:64px}
  </style></head><body class="pagina"><main class="pagina__conteudo pagina__conteudo--centro"><div class="cartao jogo"><section id="inicio" class="tela"><h2>🔎 CAÇA-PALAVRAS</h2><p class="instrucao">Escolha um tema. A partida usa 8 palavras.</p><div id="temas" class="escolhas"></div><h3>DIFICULDADE</h3><div id="dificuldades" class="escolhas"></div><button id="comecar" class="botao botao--sucesso">COMEÇAR</button></section><section id="partida" class="tela" hidden><div class="placar"><span>⏱️ <span id="tempo">0:00</span></span><span class="placar__certo">ENCONTRADAS: <span id="quantidade">0</span>/8</span></div><progress id="progresso" class="progresso" max="8" value="0"></progress><p class="instrucao">Arraste em linha reta ou toque na primeira e na última letra.</p><div class="area"><div id="grade" class="grade" role="grid" aria-label="Grade do caça-palavras"></div><div id="lista" class="lista" aria-label="Palavras para encontrar"></div></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="acoes"><button id="sair" class="botao botao--neutro">TROCAR TEMA</button></div></section><section id="final" class="tela" hidden><h2>🏆 VOCÊ ENCONTROU TODAS!</h2><p id="resumo"></p><p id="estrelas" style="font-size:2rem"></p><div class="acoes"><button id="de-novo" class="botao botao--sucesso">JOGAR DE NOVO</button><button id="trocar" class="botao botao--neutro">TROCAR TEMA</button></div></section></div></main><script type="module" src="./tela.js"></script></body></html>
