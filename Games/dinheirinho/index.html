<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Aprenda valores, centavos e troco juntando moedas e notas."><meta property="og:title" content="Dinheirinho — Jogos da Elis"><meta property="og:description" content="Compras e troco com valores em reais."><meta name="theme-color" content="#ff69b4"><title>Dinheirinho</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icones/icone-192.png"><link rel="stylesheet" href="../../shared/base.css"><script type="module" src="../../shared/pwa.js"></script><style>
.jogo{max-width:720px;text-align:center}.tela[hidden]{display:none}.niveis{display:grid;gap:12px;margin:18px 0}.nivel[aria-pressed=true]{background:var(--cor-principal-profunda);color:#fff}.produto{font-size:clamp(4rem,18vw,7rem);line-height:1.1}.nome{font-size:1.4rem}.preco,.total{font-size:clamp(1.7rem,8vw,2.5rem);color:var(--cor-texto-destaque);margin:8px}.dinheiro{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 0}.valor{padding:5px;min-height:58px;font:700 1rem var(--fonte-leitura);color:#263b2e;cursor:pointer}.moeda{width:64px;border:4px solid #b08b2f;border-radius:50%;background:#f5d76e}.nota{min-width:92px;border:4px double #31754b;border-radius:8px;background:#b8e0c3}.usado{font-family:var(--fonte-leitura);min-height:2em}.acoes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.progresso{width:100%;height:14px;accent-color:var(--cor-principal)}@media(max-width:390px){.jogo{padding:14px 8px}.valor{min-height:56px}.moeda{width:58px}.nota{min-width:82px}}
</style></head><body class="pagina"><main class="pagina__conteudo pagina__conteudo--centro"><div class="cartao jogo"><section id="inicio" class="tela"><h2>🛍️ DINHEIRINHO</h2><p>Junte o valor certo usando moedas e notas desenhadas.</p><div class="niveis"><button class="botao botao--neutro nivel" data-nivel="1">Revisão · valores inteiros até R$ 10</button><button class="botao botao--neutro nivel" data-nivel="2">Intermediário · centavos até R$ 20</button><button class="botao botao--neutro nivel" data-nivel="3">Desafio · calcule o troco</button></div><button id="comecar" class="botao botao--sucesso">COMEÇAR</button></section><section id="partida" class="tela" hidden><div class="placar"><span class="placar__certo">ACERTOS: <span id="acertos">0</span></span><span class="placar__errado">ERROS: <span id="erros">0</span></span><span>COMPRA: <span id="atual">1</span>/10</span></div><progress id="progresso" class="progresso" max="10" value="0"></progress><div id="produto" class="produto"></div><div id="nome" class="nome"></div><div id="preco" class="preco"></div><p id="pedido"></p><div class="total">Juntei: <span id="total">R$ 0,00</span></div><div id="dinheiro" class="dinheiro"></div><div id="usado" class="usado"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="acoes"><button id="desfazer" class="botao botao--neutro">↩️ DESFAZER</button><button id="conferir" class="botao botao--sucesso">CONFERIR</button><button id="proxima" class="botao" hidden>PRÓXIMA</button><button id="sair" class="botao botao--neutro">TROCAR NÍVEL</button></div></section><section id="final" class="tela" hidden><h2>🏆 COMPRAS CONCLUÍDAS!</h2><p id="resumo"></p><p id="estrelas" style="font-size:2rem"></p><div class="acoes"><button id="de-novo" class="botao botao--sucesso">JOGAR DE NOVO</button><button id="trocar" class="botao botao--neutro">TROCAR NÍVEL</button></div></section></div></main><script type="module" src="./tela.js"></script></body></html>
