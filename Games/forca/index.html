<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2290%22%3E%F0%9F%8E%89%3C%2Ftext%3E%3C%2Fsvg%3E">
  <title>Jogo da Forca</title>
  <link rel="stylesheet" href="../../shared/base.css">
  <style>
    /* Só o que é específico da forca: o resto vem do base.css. */
    .forca {
      max-width: 620px;
      margin: 0 auto;
      text-align: center;
    }
    #tema {
      font-size: clamp(1rem, 4.5vw, 1.3rem);
      color: var(--cor-principal-escura);
      margin: 14px 0 4px;
    }
    #forca {
      font-size: clamp(3.5rem, 18vw, 6rem);
      line-height: 1.2;
    }
    #palavra {
      font-size: clamp(1.5rem, 8vw, 2.5rem);
      letter-spacing: 0.15em;
      margin: 12px auto;
      max-width: 100%;
      overflow-wrap: break-word;
      color: var(--cor-texto);
    }
    .letras {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 520px;
      margin: 0 auto;
    }
    /* Letra é botão quadrado: aproveita .botao--neutro mas sem o padding largo. */
    .letra {
      width: var(--toque);
      padding: 0;
      font-size: 1.2rem;
      border-radius: 12px;
    }
    #mensagem {
      margin-top: 16px;
    }
  </style>
</head>
<body class="pagina">
  <script src="../../shared/cabecalho.js" data-titulo="Jogo da Forca"></script>

  <div class="pagina__conteudo">
    <div class="forca">
      <div id="placar" class="placar"></div>
      <div id="tema"></div>
      <div id="forca">😀</div>
      <div id="palavra"></div>
      <div class="letras" id="botoes"></div>
      <div id="mensagem" class="feedback" aria-live="polite"></div>
      <button id="novaPalavraBtn" class="botao botao--sucesso" style="display: none;">Nova Palavra</button>
    </div>
  </div>

  <script type="module">
    import { normalizar, sortear } from '../../shared/texto.js';
    import { tocar } from '../../shared/sons.js';
    import { lancarConfete, animar } from '../../shared/confete.js';

    // Cada palavra vem com o tema, escrita com a acentuação correta.
    const palavras = [
      // Animais
      { palavra: "LEÃO", categoria: "Animais" },
      { palavra: "PÁSSARO", categoria: "Animais" },
      { palavra: "ELEFANTE", categoria: "Animais" },
      { palavra: "CACHORRO", categoria: "Animais" },
      { palavra: "GATO", categoria: "Animais" },
      { palavra: "MACACO", categoria: "Animais" },
      { palavra: "PATO", categoria: "Animais" },
      { palavra: "GIRAFA", categoria: "Animais" },
      { palavra: "URSO", categoria: "Animais" },
      { palavra: "PEIXE", categoria: "Animais" },
      { palavra: "SAPO", categoria: "Animais" },
      { palavra: "COELHO", categoria: "Animais" },
      { palavra: "TIGRE", categoria: "Animais" },
      { palavra: "CAVALO", categoria: "Animais" },
      { palavra: "TARTARUGA", categoria: "Animais" },
      { palavra: "BORBOLETA", categoria: "Animais" },
      { palavra: "PINGUIM", categoria: "Animais" },
      { palavra: "GOLFINHO", categoria: "Animais" },
      { palavra: "JACARÉ", categoria: "Animais" },
      { palavra: "ABELHA", categoria: "Animais" },
      { palavra: "CORUJA", categoria: "Animais" },

      // Comidas
      { palavra: "ABACAXI", categoria: "Comidas" },
      { palavra: "BANANA", categoria: "Comidas" },
      { palavra: "SORVETE", categoria: "Comidas" },
      { palavra: "BISCOITO", categoria: "Comidas" },
      { palavra: "SUCO", categoria: "Comidas" },
      { palavra: "PIRULITO", categoria: "Comidas" },
      { palavra: "MELANCIA", categoria: "Comidas" },
      { palavra: "MORANGO", categoria: "Comidas" },
      { palavra: "CHOCOLATE", categoria: "Comidas" },
      { palavra: "PIPOCA", categoria: "Comidas" },
      { palavra: "FEIJÃO", categoria: "Comidas" },
      { palavra: "MAÇÃ", categoria: "Comidas" },
      { palavra: "QUEIJO", categoria: "Comidas" },
      { palavra: "BOLO", categoria: "Comidas" },
      { palavra: "LIMÃO", categoria: "Comidas" },
      { palavra: "MAMÃO", categoria: "Comidas" },

      // Casa
      { palavra: "CAMA", categoria: "Casa" },
      { palavra: "MESA", categoria: "Casa" },
      { palavra: "CADEIRA", categoria: "Casa" },
      { palavra: "JANELA", categoria: "Casa" },
      { palavra: "PORTA", categoria: "Casa" },
      { palavra: "SOFÁ", categoria: "Casa" },
      { palavra: "ARMÁRIO", categoria: "Casa" },
      { palavra: "TRAVESSEIRO", categoria: "Casa" },
      { palavra: "COBERTOR", categoria: "Casa" },
      { palavra: "ESCADA", categoria: "Casa" },
      { palavra: "ESPELHO", categoria: "Casa" },
      { palavra: "CHUVEIRO", categoria: "Casa" },
      { palavra: "GELADEIRA", categoria: "Casa" },
      { palavra: "TELEVISÃO", categoria: "Casa" },

      // Escola
      { palavra: "ESCOLA", categoria: "Escola" },
      { palavra: "LIVRO", categoria: "Escola" },
      { palavra: "CADERNO", categoria: "Escola" },
      { palavra: "LÁPIS", categoria: "Escola" },
      { palavra: "BORRACHA", categoria: "Escola" },
      { palavra: "MOCHILA", categoria: "Escola" },
      { palavra: "PROFESSORA", categoria: "Escola" },
      { palavra: "TESOURA", categoria: "Escola" },
      { palavra: "RÉGUA", categoria: "Escola" },
      { palavra: "APONTADOR", categoria: "Escola" },
      { palavra: "RECREIO", categoria: "Escola" },

      // Natureza
      { palavra: "FLORESTA", categoria: "Natureza" },
      { palavra: "ESTRELA", categoria: "Natureza" },
      { palavra: "NUVEM", categoria: "Natureza" },
      { palavra: "CHUVA", categoria: "Natureza" },
      { palavra: "ÁRVORE", categoria: "Natureza" },
      { palavra: "MONTANHA", categoria: "Natureza" },
      { palavra: "CACHOEIRA", categoria: "Natureza" },
      { palavra: "PRAIA", categoria: "Natureza" },
      { palavra: "VENTO", categoria: "Natureza" },
      { palavra: "JARDIM", categoria: "Natureza" },
      { palavra: "SEMENTE", categoria: "Natureza" },
      { palavra: "GIRASSOL", categoria: "Natureza" },

      // Brinquedos
      { palavra: "BOLA", categoria: "Brinquedos" },
      { palavra: "CARRINHO", categoria: "Brinquedos" },
      { palavra: "BONECA", categoria: "Brinquedos" },
      { palavra: "PIPA", categoria: "Brinquedos" },
      { palavra: "BRINQUEDO", categoria: "Brinquedos" },
      { palavra: "BICICLETA", categoria: "Brinquedos" },
      { palavra: "PATINETE", categoria: "Brinquedos" },
      { palavra: "PIÃO", categoria: "Brinquedos" },
      { palavra: "BALANÇO", categoria: "Brinquedos" },
      { palavra: "PETECA", categoria: "Brinquedos" },
      { palavra: "URSINHO", categoria: "Brinquedos" },

      // Contos de fada
      { palavra: "PRINCESA", categoria: "Contos de fada" },
      { palavra: "RAINHA", categoria: "Contos de fada" },
      { palavra: "CASTELO", categoria: "Contos de fada" },
      { palavra: "FADA", categoria: "Contos de fada" },
      { palavra: "DRAGÃO", categoria: "Contos de fada" },
      { palavra: "BRUXA", categoria: "Contos de fada" },
      { palavra: "GIGANTE", categoria: "Contos de fada" },
      { palavra: "SEREIA", categoria: "Contos de fada" },
      { palavra: "DUENDE", categoria: "Contos de fada" },
      { palavra: "VARINHA", categoria: "Contos de fada" },
      { palavra: "FEITIÇO", categoria: "Contos de fada" },

      // Corpo
      { palavra: "CORAÇÃO", categoria: "Corpo" },
      { palavra: "CABEÇA", categoria: "Corpo" },
      { palavra: "BRAÇO", categoria: "Corpo" },
      { palavra: "PERNA", categoria: "Corpo" },
      { palavra: "CABELO", categoria: "Corpo" },
      { palavra: "ORELHA", categoria: "Corpo" },
      { palavra: "BARRIGA", categoria: "Corpo" },
      { palavra: "JOELHO", categoria: "Corpo" }
    ];

    const estagios = ["😀", "😮", "😕", "😟", "😣", "😭", "💀"];
    const MAX_ERROS = estagios.length - 1; // 6 erros

    // Estado da rodada
    let atual = null;          // { palavra, categoria }
    let letrasDaPalavra = new Set(); // letras normalizadas que a palavra tem
    let letrasCertas = new Set();    // letras normalizadas já reveladas
    let erros = 0;
    let jogoEncerrado = false;

    // Placar da sessão (mantido entre palavras)
    let vitorias = 0;
    let derrotas = 0;

    const elPlacar = document.getElementById("placar");
    const elTema = document.getElementById("tema");
    const elForca = document.getElementById("forca");
    const elPalavra = document.getElementById("palavra");
    const elBotoes = document.getElementById("botoes");
    const elMensagem = document.getElementById("mensagem");
    const btnNovaPalavra = document.getElementById("novaPalavraBtn");

    function atualizarPlacar() {
      elPlacar.textContent = `Vitórias: ${vitorias} | Derrotas: ${derrotas} | Erros nesta palavra: ${erros} de ${MAX_ERROS}`;
    }

    function mostrarPalavra(revelarTudo) {
      let exibicao = "";
      for (const letra of atual.palavra) {
        const chave = normalizar(letra);
        if (!/[A-Z]/.test(chave)) {
          exibicao += letra + " ";           // espaços e hífens aparecem sempre
        } else if (revelarTudo || letrasCertas.has(chave)) {
          exibicao += letra + " ";           // mostra a letra com o acento original
        } else {
          exibicao += "_ ";
        }
      }
      elPalavra.textContent = exibicao.trim();
    }

    function criarBotoes() {
      const alfabeto = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      for (const letra of alfabeto) {
        const botao = document.createElement("button");
        botao.className = "botao botao--neutro letra";
        botao.textContent = letra;
        botao.dataset.letra = letra;
        botao.setAttribute("aria-label", `Letra ${letra}`);
        botao.addEventListener("click", () => jogar(letra));
        elBotoes.appendChild(botao);
      }
    }

    function botaoDaLetra(letra) {
      return elBotoes.querySelector(`button[data-letra="${letra}"]`);
    }

    function venceu() {
      for (const letra of letrasDaPalavra) {
        if (!letrasCertas.has(letra)) return false;
      }
      return true;
    }

    function jogar(letraDigitada) {
      if (jogoEncerrado) return;
      const letra = normalizar(letraDigitada);
      if (!/^[A-Z]$/.test(letra)) return;

      const botao = botaoDaLetra(letra);
      if (!botao || botao.disabled) return;
      botao.disabled = true;

      if (letrasDaPalavra.has(letra)) {
        letrasCertas.add(letra);
        mostrarPalavra(false);
        if (venceu()) {
          vitorias++;
          elMensagem.textContent = `🎉 Você ganhou! A palavra era: ${atual.palavra}`;
          elMensagem.classList.add('feedback--certo');
          tocar('vitoria');
          lancarConfete();
          fimDeJogo();
        } else {
          tocar('acerto');
          animar(elPalavra, 'pular');
        }
      } else {
        erros++;
        elForca.textContent = estagios[erros];
        tocar('erro');
        animar(elForca, 'tremer');
        if (erros >= MAX_ERROS) {
          derrotas++;
          mostrarPalavra(true);
          elMensagem.textContent = `💀 Você perdeu! A palavra era: ${atual.palavra}`;
          elMensagem.classList.add('feedback--errado');
          fimDeJogo();
        }
      }
      atualizarPlacar();
    }

    function fimDeJogo() {
      jogoEncerrado = true;
      btnNovaPalavra.style.display = "inline-block";
      elBotoes.querySelectorAll("button").forEach(b => { b.disabled = true; });
      btnNovaPalavra.focus();
    }

    function novaPalavra() {
      atual = sortear(palavras, atual);   // não repete a palavra anterior

      letrasDaPalavra = new Set(
        [...normalizar(atual.palavra)].filter(c => /[A-Z]/.test(c))
      );
      letrasCertas = new Set();
      erros = 0;
      jogoEncerrado = false;

      elTema.textContent = `Tema: ${atual.categoria}`;
      elForca.textContent = estagios[0];
      elMensagem.textContent = "";
      elMensagem.className = "feedback";
      btnNovaPalavra.style.display = "none";
      elBotoes.querySelectorAll("button").forEach(b => { b.disabled = false; });
      mostrarPalavra(false);
      atualizarPlacar();
    }

    // Teclado físico: aceita A–Z e também Ç, que conta como C.
    document.addEventListener("keydown", (evento) => {
      if (evento.ctrlKey || evento.metaKey || evento.altKey) return;
      if (evento.key.length !== 1) return;
      const letra = normalizar(evento.key);
      if (/^[A-Z]$/.test(letra)) jogar(letra);
    });

    btnNovaPalavra.addEventListener("click", () => {
      tocar('clique');
      novaPalavra();
    });

    criarBotoes();
    novaPalavra();
  </script>
</body>
</html>
