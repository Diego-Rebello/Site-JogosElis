<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Organize sílabas para formar palavras, com revisão e um desafio de palavras longas."><meta property="og:title" content="Forme a Palavra — Jogos da Elis"><meta property="og:description" content="Monte palavras tocando nas sílabas na ordem certa."><meta name="theme-color" content="#ff69b4"><title>Forme a Palavra</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icones/icone-192.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="../../shared/base.css"><script type="module" src="../../shared/pwa.js"></script><style>
 .jogo{max-width:650px;text-align:center}.tela[hidden]{display:none}.escolhas{display:grid;gap:12px;margin:18px 0}.nivel{min-height:68px}.nivel[aria-pressed="true"]{background:var(--cor-principal-profunda);color:#fff}.instrucao{font-family:var(--fonte-leitura);color:var(--cor-suave)}.progresso{width:100%;height:15px;accent-color:var(--cor-principal)}.emoji{font-size:clamp(4rem,20vw,7rem);line-height:1.2;margin:8px}.linha,.pecas{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;min-height:82px;padding:10px;border-radius:15px}.linha{border:3px dashed var(--cor-secundaria);background:#fff}.pecas{margin-top:12px}.peca{min-height:56px;min-width:60px;padding:10px 15px;font-size:1.35rem}.linha .peca{background:var(--cor-certo);box-shadow:0 4px 0 #125631}.acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.cronometro{font-size:1.2rem}.palavra-certa{font-size:1.8rem;color:var(--cor-certo)}
 @media(max-width:390px){.jogo{padding:16px 10px}.peca{padding:9px 11px;min-width:52px}}
 .botao.nivel{min-height:68px}.botao.peca{min-height:56px;min-width:60px;font-size:1.35rem}
 </style></head><body class="pagina"><main class="pagina__conteudo pagina__conteudo--centro"><div class="cartao jogo"><section id="inicio" class="tela"><h2>🧩 FORME A PALAVRA</h2><p class="instrucao">Toque nas sílabas na ordem certa. No Desafio, uma peça é intrusa!</p><div class="escolhas"><button class="botao botao--neutro nivel" data-nivel="1">Revisão · até 2 sílabas</button><button class="botao botao--neutro nivel" data-nivel="2">Intermediário · 3 sílabas</button><button class="botao botao--neutro nivel" data-nivel="3">Desafio · 4+ sílabas e intrusa</button></div><button id="comecar" class="botao botao--sucesso">COMEÇAR</button></section><section id="partida" class="tela" hidden><div class="placar"><span class="placar__certo">ACERTOS: <span id="acertos">0</span></span><span class="placar__errado">ERROS: <span id="erros">0</span></span><span class="cronometro">⏱️ <span id="tempo">0:00</span></span></div><progress id="progresso" class="progresso" max="10" value="0"></progress><p>PALAVRA <span id="atual">1</span>/10</p><div id="emoji" class="emoji"></div><div id="linha" class="linha" aria-label="Palavra montada"></div><div id="pecas" class="pecas" aria-label="Sílabas disponíveis"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="acoes"><button id="sair" class="botao botao--neutro">TROCAR NÍVEL</button></div></section><section id="final" class="tela" hidden><h2>🏆 RODADA CONCLUÍDA!</h2><p id="resumo"></p><p id="estrelas" style="font-size:2rem"></p><div class="acoes"><button id="de-novo" class="botao botao--sucesso">JOGAR DE NOVO</button><button id="trocar" class="botao botao--neutro">TROCAR NÍVEL</button></div></section></div></main><script type="module" src="./tela.js"></script></body></html>
