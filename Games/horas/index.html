<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Aprenda a ler e ajustar um relógio analógico, da hora cheia ao minuto a minuto."><meta property="og:title" content="Que Horas São? — Jogos da Elis"><meta property="og:description" content="Leia e ajuste as horas em um relógio analógico."><meta name="theme-color" content="#ff69b4"><title>Que Horas São?</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icones/icone-192.png"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%92%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="../../shared/base.css"><script type="module" src="../../shared/pwa.js"></script><style>
 .jogo{max-width:690px;text-align:center}.tela[hidden]{display:none}.escolhas{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px;margin:15px 0}.escolha{min-height:62px;padding:10px}.escolha[aria-pressed="true"]{background:var(--cor-principal-profunda);color:#fff}.instrucao{font-family:var(--fonte-leitura);color:var(--cor-suave)}.progresso{width:100%;height:15px;accent-color:var(--cor-principal)}.relogio{width:min(82vw,330px);height:auto;display:block;margin:8px auto}.mostrador{fill:#fff;stroke:var(--cor-principal-profunda);stroke-width:4}.marca{stroke:#b57695;stroke-width:2}.numero{font:700 14px var(--fonte-leitura);fill:var(--cor-texto)}.ponteiro-hora{stroke:#5e3a50;stroke-width:8;stroke-linecap:round}.ponteiro-minuto{stroke:#d81b7f;stroke-width:5;stroke-linecap:round}.pino{fill:#5e3a50}.opcoes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:480px;margin:auto}.opcao{min-height:58px;font-size:1.5rem}.digital{font-size:2.2rem;color:var(--cor-texto-destaque);margin:8px}.ajustes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:480px;margin:auto}.acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:12px}@media(max-width:390px){.jogo{padding:15px 10px}.botao{padding:10px 13px}.relogio{width:min(75vw,280px)}}

 </style></head><body class="pagina"><main class="pagina__conteudo pagina__conteudo--centro"><div class="cartao jogo"><section id="inicio" class="tela"><h2>🕒 QUE HORAS SÃO?</h2><p class="instrucao">Escolha o nível e depois leia ou ajuste os ponteiros.</p><div id="niveis" class="escolhas"></div><div class="escolhas"><button class="botao modo" data-modo="leia">👀 Leia</button><button class="botao modo" data-modo="ajuste">🛠️ Ajuste</button></div></section><section id="partida" class="tela" hidden><div class="placar"><span class="placar__certo">ACERTOS: <span id="acertos">0</span></span><span class="placar__errado">ERROS: <span id="erros">0</span></span><span>RELÓGIO: <span id="atual">1</span>/10</span></div><progress id="progresso" class="progresso" max="10" value="0"></progress><p id="pedido" class="instrucao"></p><svg class="relogio" viewBox="0 0 240 240" role="img" aria-label="Relógio analógico"><circle class="mostrador" cx="120" cy="120" r="108"/><g id="marcas"></g><line id="hora" class="ponteiro-hora" x1="120" y1="120" x2="120" y2="66"/><line id="minuto" class="ponteiro-minuto" x1="120" y1="120" x2="120" y2="38"/><circle class="pino" cx="120" cy="120" r="7"/></svg><div id="digital" class="digital" hidden></div><div id="opcoes" class="opcoes"></div><div id="ajustes" class="ajustes" hidden><button class="botao botao--neutro" data-ajuste="-5">−5 min</button><button class="botao botao--neutro" data-ajuste="5">+5 min</button><button class="botao botao--neutro" data-ajuste="-60">−1 h</button><button class="botao botao--neutro" data-ajuste="60">+1 h</button><button id="conferir" class="botao botao--sucesso" style="grid-column:1/-1">CONFERIR</button></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="acoes"><button id="proxima" class="botao" hidden>PRÓXIMO</button><button id="sair" class="botao botao--neutro">TROCAR MODO</button></div></section><section id="final" class="tela" hidden><h2>🏆 RODADA CONCLUÍDA!</h2><p id="resumo"></p><p id="estrelas"
