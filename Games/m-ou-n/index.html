<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Treine a regra do M antes de P e B. Complete as palavras por toque ou digitando, com a regra explicada e placar por rodada.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="Jogo do M ou N — Jogos da Elis">
    <meta property="og:description" content="Treine a regra do M antes de P e B. Complete as palavras por toque ou digitando, com a regra explicada e placar por rodada.">
    <meta name="theme-color" content="#ff69b4">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icones/icone-192.png">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2290%22%3E%E2%9C%8F%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E">
    <title>Jogo do M ou N</title>
    <link rel="stylesheet" href="../../shared/base.css">
    <script type="module" src="../../shared/pwa.js"></script>
    <style>
        /* Só o que é específico deste jogo: o resto vem do base.css. */
        .mn {
            max-width: 520px;
            text-align: center;
            text-transform: uppercase;   /* o jogo inteiro em caixa alta */
        }
        .mn__instrucao {
            font-family: var(--fonte-leitura);
            text-transform: none;
            color: var(--cor-suave);
            margin: 0 0 18px;
        }
        #palavra-desafio {
            font-size: clamp(1.7rem, 9vw, 2.2rem);
            color: var(--cor-texto-destaque);
            letter-spacing: 4px;
            margin: 24px 0;
            padding: 15px 10px;
            border: 3px dashed var(--cor-secundaria);
            border-radius: 12px;
            overflow-wrap: break-word;
        }
        #campo-resposta {
            max-width: 340px;
            margin: 0 auto 20px;
            text-transform: uppercase;
        }
        .palavra-certa {
            color: var(--cor-texto-destaque);
            font-size: 1.15em;
            letter-spacing: 2px;
        }
        .botoes {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .tela[hidden] { display: none; }
        .modos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 22px 0; }
        .modo { min-height: 86px; font-size: 1.15rem; }
        .regra { text-transform: none; font-family: var(--fonte-leitura); font-size: 1.2rem; line-height: 1.6; background: #fff7cf; border: 3px solid #f2ca52; border-radius: 16px; padding: 18px; }
        .progresso { width: 100%; height: 16px; accent-color: var(--cor-principal); margin: 12px 0; }
        .letras-toque { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin: 16px auto; max-width: 330px; }
        .letra-toque { min-height: 92px; font-size: 2.5rem; }
        .letra-destaque { color: var(--cor-texto-destaque); text-decoration: underline; }
        @media (max-width: 420px) { .modos { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="pagina">


    <main class="pagina__conteudo pagina__conteudo--centro">
        <div class="cartao mn">
          <section id="tela-modos" class="tela">
            <h1>JOGO DO M OU N</h1><p class="mn__instrucao">COMO VOCÊ QUER JOGAR?</p>
            <div class="modos"><button class="botao botao--neutro modo" data-modo="toque">👆 TOQUE<br>M OU N</button><button class="botao botao--neutro modo" data-modo="digitar">⌨️ DIGITE<br>A PALAVRA</button></div>
          </section>
          <section id="tela-regra" class="tela" hidden>
            <h2>UMA REGRA IMPORTANTE</h2><div class="regra">Antes de <strong>P</strong> e <strong>B</strong> usamos <strong>M</strong>.<br>Antes das outras letras usamos <strong>N</strong>.</div><button id="entendi" class="botao botao--sucesso" style="margin-top:20px">ENTENDI!</button>
          </section>
          <section id="tela-jogo" class="tela" hidden>
            <p class="mn__instrucao">COMPLETE A PALAVRA COM M OU N!</p>
            <div class="placar">
                <span class="placar__certo">ACERTOS: <span id="placar-acertos">0</span></span>
                <span class="placar__errado">ERROS: <span id="placar-erros">0</span></span>
                <span>PALAVRA: <span id="palavra-atual">1</span>/10</span>
            </div>
            <progress id="progresso" class="progresso" max="10" value="0">0 DE 10</progress>
            <div id="palavra-desafio"></div>
            <label class="so-leitor" for="campo-resposta">Escreva a palavra completa</label>
            <input type="text" id="campo-resposta" class="campo" placeholder="DIGITE AQUI"
                   autocomplete="off" autocapitalize="characters" spellcheck="false">
            <div id="letras-toque" class="letras-toque" hidden><button class="botao letra-toque" data-letra="M">M</button><button class="botao letra-toque" data-letra="N">N</button></div>
            <div id="acao-verificar" class="botoes">
                <button id="btn-verificar" class="botao">VERIFICAR</button>
            </div>
            <div id="feedback" class="feedback" aria-live="polite"></div>
            <div class="botoes">
                <button id="btn-novo" class="botao botao--sucesso" hidden>PRÓXIMA PALAVRA</button>
                <button id="btn-reiniciar" class="botao botao--neutro">TROCAR MODO</button>
            </div>
          </section>
          <section id="tela-final" class="tela" hidden><h2>🏆 RODADA CONCLUÍDA!</h2><p id="resumo-final"></p><p id="estrelas-final" style="font-size:2rem"></p><div class="botoes"><button id="jogar-novamente" class="botao botao--sucesso">JOGAR DE NOVO</button><button id="trocar-modo" class="botao botao--neutro">TROCAR MODO</button></div></section>
        </div>
    </main>

    <script type="module">
      import { montarCabecalho } from '../../shared/cabecalho.js';
      montarCabecalho('Jogo do M ou N');

        import { normalizar, sortearVarios } from '../../shared/texto.js';
        import { gerarLacuna, listaDePalavras } from './jogo.js';
        import { tocar } from '../../shared/sons.js';
        import { lancarConfete, animar } from '../../shared/confete.js';
        import { calcularEstrelas, obterConfiguracoes, registrarPartida } from '../../shared/progresso.js';

        // --- LÓGICA DO JOGO ---

        // Confere a lista inteira ao carregar a página: uma palavra inválida quebra na hora.
        listaDePalavras.forEach(gerarLacuna);

        const configuracoes = obterConfiguracoes();
        const nomeCrianca = configuracoes.nomeCrianca.toUpperCase();
        const nivelPadrao = configuracoes.niveis['m-ou-n'];
        const listaAtiva = listaDePalavras.filter(p => nivelPadrao === 'facil' ? p.length <= 6 : nivelPadrao === 'normal' ? p.length <= 9 : true);
        const $ = id => document.getElementById(id);
        const telas = ['tela-modos', 'tela-regra', 'tela-jogo', 'tela-final'];
        let modo = 'toque', rodada = [], indice = 0, acertos = 0, erros = 0, respondida = false, timeout = null;

        function exibirTela(id) { telas.forEach(tela => $(tela).hidden = tela !== id); }
        function escapar(texto) { const div = document.createElement('div'); div.textContent = texto; return div.innerHTML; }
        function destacar(palavra) { const { indice: pos } = gerarLacuna(palavra); return `${escapar(palavra.slice(0,pos))}<strong class="letra-destaque">${palavra[pos]}</strong>${escapar(palavra.slice(pos+1))}`; }
        function feedback(html, estado) { $('feedback').innerHTML = html; $('feedback').className = `feedback${estado ? ` feedback--${estado}` : ''}`; }
        function escolherModo(novoModo) { modo = novoModo; tocar('clique'); exibirTela('tela-regra'); }

        function iniciarRodada() {
          if (timeout) clearTimeout(timeout);
          rodada = sortearVarios(listaAtiva, 10); indice = 0; acertos = 0; erros = 0;
          $('placar-acertos').textContent = '0'; $('placar-erros').textContent = '0'; exibirTela('tela-jogo'); mostrarPalavra();
        }
        function mostrarPalavra() {
          respondida = false; const palavra = rodada[indice];
          $('palavra-atual').textContent = indice + 1; $('progresso').value = indice;
          $('palavra-desafio').textContent = gerarLacuna(palavra).texto; $('campo-resposta').value = ''; $('campo-resposta').disabled = false;
          $('campo-resposta').hidden = modo !== 'digitar'; $('acao-verificar').hidden = modo !== 'digitar'; $('letras-toque').hidden = modo !== 'toque';
          $('btn-verificar').disabled = false; $('letras-toque').querySelectorAll('button').forEach(b => b.disabled = false); $('btn-novo').hidden = true; feedback('', null);
          if (modo === 'digitar') $('campo-resposta').focus();
        }
        function responder(valor) {
          if (respondida) return; const palavra = rodada[indice]; const lacuna = gerarLacuna(palavra);
          if (!String(valor).trim()) { feedback('DIGITE UMA PALAVRA.', 'errado'); tocar('erro'); return; }
          respondida = true; const acertou = modo === 'toque' ? normalizar(valor) === lacuna.resposta : normalizar(valor) === normalizar(palavra);
          $('campo-resposta').disabled = true; $('btn-verificar').disabled = true; $('letras-toque').querySelectorAll('button').forEach(b => b.disabled = true);
          if (acertou) {
            acertos++; $('placar-acertos').textContent = acertos; feedback(`MUITO BEM, ${escapar(nomeCrianca)}!<br>${destacar(palavra)}`, 'certo'); tocar('acerto'); animar($('feedback'), 'pular');
            timeout = setTimeout(avancar, 1000);
          } else {
            erros++; $('placar-erros').textContent = erros; feedback(`A PALAVRA CORRETA É ${destacar(palavra)}.<br>ANTES DE <strong>P</strong> E <strong>B</strong>, USE <strong>M</strong>. ANTES DAS OUTRAS LETRAS, USE <strong>N</strong>.`, 'errado'); tocar('erro'); animar($('feedback'), 'tremer'); $('btn-novo').hidden = false; $('btn-novo').focus();
          }
        }
        function avancar() { if (timeout) clearTimeout(timeout); timeout = null; indice++; $('progresso').value = indice; indice >= 10 ? finalizar() : mostrarPalavra(); }
        function finalizar() { const estrelas = calcularEstrelas(acertos, erros); registrarPartida('m-ou-n', { acertos, erros, estrelas }); $('resumo-final').textContent = `PARABÉNS, ${nomeCrianca}! VOCÊ ACERTOU ${acertos} DE 10.`; $('estrelas-final').textContent = '⭐'.repeat(estrelas); exibirTela('tela-final'); tocar('vitoria'); lancarConfete(); }

        document.querySelectorAll('[data-modo]').forEach(b => b.addEventListener('click', () => escolherModo(b.dataset.modo)));
        document.querySelectorAll('[data-letra]').forEach(b => b.addEventListener('click', () => responder(b.dataset.letra)));
        $('entendi').addEventListener('click', iniciarRodada); $('btn-verificar').addEventListener('click', () => responder($('campo-resposta').value));
        $('campo-resposta').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); responder($('campo-resposta').value); } });
        $('btn-novo').addEventListener('click', avancar); $('jogar-novamente').addEventListener('click', iniciarRodada);
        [$('btn-reiniciar'), $('trocar-modo')].forEach(b => b.addEventListener('click', () => { if (timeout) clearTimeout(timeout); tocar('clique'); exibirTela('tela-modos'); }));

    </script>
</body>
</html>
