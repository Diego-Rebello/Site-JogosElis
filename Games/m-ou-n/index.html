<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2290%22%3E%E2%9C%8F%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E">
    <title>Jogo do M ou N</title>
    <link rel="stylesheet" href="../../shared/base.css">
    <style>
        /* Só o que é específico deste jogo: o resto vem do base.css. */
        .mn {
            max-width: 520px;
            text-align: center;
            text-transform: uppercase;   /* o jogo inteiro em caixa alta */
        }
        .mn__instrucao {
            font-family: var(--fonte-leitura);
            text-transform: none;
            color: var(--cor-suave);
            margin: 0 0 18px;
        }
        #palavra-desafio {
            font-size: clamp(1.7rem, 9vw, 2.2rem);
            color: var(--cor-principal-escura);
            letter-spacing: 4px;
            margin: 24px 0;
            padding: 15px 10px;
            border: 3px dashed var(--cor-secundaria);
            border-radius: 12px;
            overflow-wrap: break-word;
        }
        #campo-resposta {
            max-width: 340px;
            margin: 0 auto 20px;
            text-transform: uppercase;
        }
        .palavra-certa {
            color: var(--cor-principal-escura);
            font-size: 1.15em;
            letter-spacing: 2px;
        }
        .botoes {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body class="pagina">

    <script src="../../shared/cabecalho.js" data-titulo="Jogo do M ou N"></script>

    <div class="pagina__conteudo pagina__conteudo--centro">
        <div class="cartao mn">
            <p class="mn__instrucao">Complete a palavra com M ou N e clique em verificar!</p>

            <div class="placar">
                <span class="placar__certo">ACERTOS: <span id="placar-acertos">0</span></span>
                <span class="placar__errado">ERROS: <span id="placar-erros">0</span></span>
                <span>PALAVRA: <span id="palavra-atual">1</span>/10</span>
            </div>

            <div id="palavra-desafio"></div>

            <label class="so-leitor" for="campo-resposta">Escreva a palavra completa</label>
            <input type="text" id="campo-resposta" class="campo" placeholder="DIGITE AQUI"
                   autocomplete="off" autocapitalize="characters" spellcheck="false">

            <div class="botoes">
                <button id="btn-verificar" class="botao">VERIFICAR</button>
            </div>

            <div id="feedback" class="feedback" aria-live="polite"></div>

            <div class="botoes">
                <button id="btn-novo" class="botao botao--sucesso">NOVA PALAVRA</button>
                <button id="btn-reiniciar" class="botao botao--neutro">REINICIAR PLACAR</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { normalizar, sortear } from '../../shared/texto.js';
        import { tocar } from '../../shared/sons.js';
        import { lancarConfete, animar } from '../../shared/confete.js';
        import { calcularEstrelas, obterConfiguracoes, registrarPartida } from '../../shared/progresso.js';

        // --- LÓGICA DO JOGO ---

        // Lista de palavras com grafia e acentuação corretas.
        // Toda palavra precisa ter um M antes de P/B ou um N antes de outra consoante.
        const listaDePalavras = [
            // M antes de P
            "CAMPO", "TEMPO", "LIMPO", "COMPRA", "TAMPA", "COMPRIDO", "EMPREGO", "SIMPLES",
            "COMPUTADOR", "LAMPIÃO", "AMPLO", "COMPANHEIRO", "CUMPRIR", "ESTAMPA", "OLIMPÍADA",
            "SIMPATIA", "TEMPERO", "ACOMPANHAR", "EXEMPLO", "IMPACTO", "INTERROMPER", "LIMPEZA",
            "PASSATEMPO", "RELÂMPAGO", "ACAMPAMENTO", "CAMPEÃO", "CAMPAINHA", "LÂMPADA",
            "TROMPETE", "IMPRIMIR", "EMPADA", "EMPURRAR", "SEMPRE", "TEMPESTADE", "COMPLETO",
            "IMPORTANTE", "SIMPÁTICO", "CAMPEONATO", "EMPRESTAR", "LIMPAR", "RAMPA",
            "TEMPERATURA", "AMPARO", "CHIMPANZÉ", "COMPARTILHAR", "EMPINAR", "COMPASSO",
            "IMPÉRIO",

            // M antes de B
            "BOMBA", "SAMBA", "POMBA", "EMBAIXO", "BOMBEIRO", "ZUMBIDO", "AMBULÂNCIA", "EMBORA",
            "MEMBRO", "SOMBRA", "TROMBONE", "SÍMBOLO", "TAMBOR", "UMBIGO", "COMBOIO", "IMBATÍVEL",
            "LOMBADA", "REEMBOLSO", "EMBLEMA", "COMBUSTÍVEL", "AMBOS", "SETEMBRO", "NOVEMBRO",
            "DEZEMBRO", "COMBINAR", "LAMBER", "TAMBÉM", "CAMBALHOTA", "GAMBÁ", "TOMBO",
            "EMBRULHO", "TIMBRE", "BAMBU", "SOMBRINHA", "COMBATE", "LOMBO", "ZUMBI", "TROMBADA",

            // N antes de outras consoantes
            "TINTA", "PENTE", "ONDA", "BANCO", "MUNDO", "VENTO", "SANTO", "CONTA", "PONTE",
            "ELEFANTE", "DENTE", "GENTE", "ONZE", "FUNDO", "LINDO", "LONGE", "MANGA", "GANSO",
            "ONÇA", "PINCEL", "BANDA", "CRIANÇA", "DANÇA", "ESTANTE", "GIGANTE", "JANTAR",
            "LANCHA", "MORANGO", "NUNCA", "PANDA", "PRESENTE", "SEGUNDA", "TANQUE", "TRANQUILO",
            "VINTE", "CONVITE", "ENCONTRAR", "FANTASMA", "INSTRUMENTO", "LARANJA", "MANTIMENTO",
            "INGLÊS", "CONSTRUIR", "INSTANTE", "MENDIGO", "TANGERINA", "TRANSPORTE", "MENSAGEM",
            "PENSAR", "CENTRO", "CONCHA", "INJEÇÃO", "CANTAR", "ANTES", "CINCO", "ONTEM",
            "DOMINGO", "CANGURU", "PINGUIM", "MENTIRA", "CONTENTE", "ANTENA", "BRINCAR",
            "CANSADO", "DENTISTA", "FONTE", "GARGANTA", "INVENTOR", "LANTERNA", "MANTEIGA",
            "QUINTAL", "SANDÁLIA", "TONTO", "VONTADE", "PINTAR", "MONTANHA", "CANTIGA", "ENCANTO"
        ];

        // Recebe a palavra completa e devolve onde fica a lacuna.
        // Primeiro procura um M antes de P ou B; se não houver, procura um N antes de consoante.
        function gerarLacuna(palavra) {
            let i = palavra.search(/M(?=[PB])/);
            if (i === -1) i = palavra.search(/N(?=[^AEIOUÁÉÍÓÚÂÊÔÃÕ])/);
            if (i === -1) throw new Error('Palavra sem M/N antes de consoante: ' + palavra);
            return { texto: palavra.slice(0, i) + '_' + palavra.slice(i + 1), resposta: palavra[i], indice: i };
        }

        // Confere a lista inteira ao carregar a página: uma palavra inválida quebra na hora.
        listaDePalavras.forEach(gerarLacuna);

        const configuracoes = obterConfiguracoes();
        const nivelPadrao = configuracoes.niveis['m-ou-n'];
        const nomeCrianca = configuracoes.nomeCrianca;
        const listaAtiva = listaDePalavras.filter(palavra => {
            if (nivelPadrao === 'facil') return palavra.length <= 6;
            if (nivelPadrao === 'normal') return palavra.length <= 9;
            return true;
        });

        // Variáveis do estado do jogo
        let palavraCorreta;
        let acertos = 0;
        let erros = 0;
        let palavrasConcluidas = 0;
        let palavraRespondida = false;
        let rodadaEncerrada = false;
        let proximaPalavraTimeout = null;
        const TOTAL_PALAVRAS = 10;

        // A cada 5 acertos vem uma comemoração. Rodadas de verdade chegam na T15.
        const ACERTOS_PARA_COMEMORAR = 5;

        // Elementos da página (DOM)
        const elPalavraDesafio = document.getElementById('palavra-desafio');
        const elCampoResposta = document.getElementById('campo-resposta');
        const elFeedback = document.getElementById('feedback');
        const elPlacarAcertos = document.getElementById('placar-acertos');
        const elPlacarErros = document.getElementById('placar-erros');
        const elPalavraAtual = document.getElementById('palavra-atual');
        const btnVerificar = document.getElementById('btn-verificar');
        const btnNovo = document.getElementById('btn-novo');
        const btnReiniciar = document.getElementById('btn-reiniciar');

        // Troca a classe de estado do feedback sem perder a classe base.
        function mostrarFeedback(html, estado) {
            elFeedback.innerHTML = html;
            elFeedback.className = 'feedback' + (estado ? ' feedback--' + estado : '');
        }

        function escaparHtml(texto) {
            const substituicoes = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return texto.replace(/[&<>"']/g, caractere => substituicoes[caractere]);
        }

        // Função para gerar uma nova palavra
        function gerarNovaPalavra() {
            if (proximaPalavraTimeout !== null) {
                clearTimeout(proximaPalavraTimeout);
                proximaPalavraTimeout = null;
            }
            palavraCorreta = sortear(listaAtiva, palavraCorreta);

            elPalavraDesafio.textContent = gerarLacuna(palavraCorreta).texto;
            elCampoResposta.value = "";
            elCampoResposta.disabled = false;
            btnVerificar.disabled = false;
            palavraRespondida = false;
            btnNovo.textContent = 'NOVA PALAVRA';
            elPalavraAtual.textContent = Math.min(palavrasConcluidas + 1, TOTAL_PALAVRAS);
            mostrarFeedback('', null);
            elCampoResposta.focus();
        }

        function finalizarRodada() {
            rodadaEncerrada = true;
            const estrelas = calcularEstrelas(acertos, erros);
            registrarPartida('m-ou-n', { acertos, erros, estrelas });
            mostrarFeedback(
                `🏆 PARABÉNS, ${escaparHtml(nomeCrianca.toUpperCase())}! RODADA CONCLUÍDA COM ${acertos} ACERTOS. ${'⭐'.repeat(estrelas)}`,
                'certo'
            );
            elCampoResposta.disabled = true;
            btnVerificar.disabled = true;
            btnNovo.textContent = 'NOVA RODADA';
            tocar('vitoria');
            lancarConfete();
        }

        // Função para verificar a resposta da criança
        function verificarResposta() {
            if (palavraRespondida || rodadaEncerrada) return;
            const respostaUsuario = elCampoResposta.value.trim();

            if (respostaUsuario === "") {
                mostrarFeedback('POR FAVOR, DIGITE UMA PALAVRA.', 'errado');
                tocar('erro');
                animar(elFeedback, 'tremer');
                return;
            }

            if (normalizar(respostaUsuario) === normalizar(palavraCorreta)) {
                palavraRespondida = true;
                acertos++;
                palavrasConcluidas++;
                elPlacarAcertos.textContent = acertos;
                mostrarFeedback(`PARABÉNS, ${escaparHtml(nomeCrianca.toUpperCase())}! VOCÊ ACERTOU!<br>A PALAVRA É <strong class="palavra-certa">`
                    + palavraCorreta + '</strong>', 'certo');
                elCampoResposta.disabled = true;
                btnVerificar.disabled = true;
                if (palavrasConcluidas >= TOTAL_PALAVRAS) {
                    finalizarRodada();
                } else if (acertos % ACERTOS_PARA_COMEMORAR === 0) {
                    tocar('vitoria');
                    lancarConfete();
                } else {
                    tocar('acerto');
                }
                animar(elFeedback, 'pular');

                if (!rodadaEncerrada) {
                    proximaPalavraTimeout = setTimeout(gerarNovaPalavra, 1800);
                }

            } else {
                erros++;
                elPlacarErros.textContent = erros;
                mostrarFeedback('OPS, TENTE DE NOVO!<br>LEMBRE-SE: USAMOS <strong>M</strong> ANTES DE <strong>P</strong> E <strong>B</strong>.', 'errado');
                tocar('erro');
                animar(elFeedback, 'tremer');
            }
        }

        // Função para reiniciar o jogo
        function reiniciarJogo() {
            if (proximaPalavraTimeout !== null) clearTimeout(proximaPalavraTimeout);
            proximaPalavraTimeout = null;
            acertos = 0;
            erros = 0;
            palavrasConcluidas = 0;
            rodadaEncerrada = false;
            elPlacarAcertos.textContent = acertos;
            elPlacarErros.textContent = erros;
            gerarNovaPalavra();
        }

        // --- Configuração dos Eventos ---
        btnVerificar.addEventListener('click', verificarResposta);
        elCampoResposta.addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                verificarResposta();
            }
        });
        btnNovo.addEventListener('click', () => {
            tocar('clique');
            if (rodadaEncerrada) reiniciarJogo();
            else gerarNovaPalavra();
        });
        btnReiniciar.addEventListener('click', () => { tocar('clique'); reiniciarJogo(); });

        // --- Inicia o jogo pela primeira vez ---
        reiniciarJogo();

    </script>
</body>
</html>
