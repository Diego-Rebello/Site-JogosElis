<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Somar</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2290%22%3E%F0%9F%94%A2%3C%2Ftext%3E%3C%2Fsvg%3E">
    <link rel="stylesheet" href="../../shared/base.css">
    <style>
        /* Só o que é específico deste jogo: o resto vem do base.css. */
        .soma {
            max-width: 480px;
            text-align: center;
        }
        .conta {
            font-size: clamp(2.4rem, 12vw, 3.4rem);
            margin: 24px 0;
            color: var(--cor-principal-escura);
        }
        #respostaInput {
            max-width: 160px;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .botoes {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body class="pagina">

    <script src="../../shared/cabecalho.js" data-titulo="Jogo de Somar"></script>

    <div class="pagina__conteudo pagina__conteudo--centro">
        <div class="cartao soma">

            <div class="placar">
                <span class="placar__certo">✔️ Acertos: <span id="acertos">0</span></span>
                <span class="placar__errado">❌ Erros: <span id="erros">0</span></span>
            </div>

            <div class="conta">
                <span id="num1"></span> + <span id="num2"></span> =
            </div>

            <label class="so-leitor" for="respostaInput">Sua resposta</label>
            <input type="number" inputmode="numeric" id="respostaInput" class="campo" placeholder="?">

            <div class="botoes">
                <button id="btnConferir" class="botao botao--sucesso">Conferir</button>
                <button id="btnNovo" class="botao">Gerar Novo</button>
                <button id="btnReiniciar" class="botao botao--neutro">Reiniciar</button>
            </div>

            <div id="feedback" class="feedback" aria-live="polite"></div>

        </div>
    </div>

    <script type="module">
        // --- 1. SELECIONANDO OS ELEMENTOS DA PÁGINA ---
        const num1Span = document.getElementById('num1');
        const num2Span = document.getElementById('num2');
        const respostaInput = document.getElementById('respostaInput');
        const btnConferir = document.getElementById('btnConferir');
        const btnNovo = document.getElementById('btnNovo');
        const feedbackDiv = document.getElementById('feedback');
        const btnReiniciar = document.getElementById('btnReiniciar');
        const acertosSpan = document.getElementById('acertos');
        const errosSpan = document.getElementById('erros');

        let respostaCorreta;
        let acertos = 0;
        let erros = 0;
        let problemaJaRespondido = false;

        // Troca a classe de estado do feedback sem perder a classe base.
        function mostrarFeedback(texto, estado) {
            feedbackDiv.textContent = texto;
            feedbackDiv.className = 'feedback' + (estado ? ' feedback--' + estado : '');
        }

        // --- 2. FUNÇÃO PARA GERAR UM NOVO PROBLEMA ---
        function gerarNovoProblema() {
            let numero1, numero2;

            // Continua gerando números até que a soma seja <= 100
            do {
                numero1 = Math.floor(Math.random() * 90) + 10;
                numero2 = Math.floor(Math.random() * 90) + 10;
            } while (numero1 + numero2 > 100);

            num1Span.textContent = numero1;
            num2Span.textContent = numero2;
            respostaCorreta = numero1 + numero2;

            problemaJaRespondido = false; // Permite responder ao novo problema
            respostaInput.value = '';
            mostrarFeedback('', null);
            respostaInput.focus();
        }

        // --- 3. FUNÇÃO PARA CONFERIR A RESPOSTA ---
        function conferirResposta() {
            // Bloqueia nova tentativa se o problema já foi respondido
            if (problemaJaRespondido) {
                return;
            }

            const respostaUsuario = parseInt(respostaInput.value);

            if (isNaN(respostaUsuario)) {
                mostrarFeedback('Digite um número!', 'errado');
                return;
            }

            problemaJaRespondido = true; // Marca o problema como respondido

            if (respostaUsuario === respostaCorreta) {
                mostrarFeedback('🎉 Parabéns! Você acertou!', 'certo');
                acertos++;
                acertosSpan.textContent = acertos;
            } else {
                mostrarFeedback(`Ops! A resposta certa era ${respostaCorreta}.`, 'errado');
                erros++;
                errosSpan.textContent = erros;
            }
        }

        // --- 4. REINICIAR PLACAR ---
        function reiniciarPlacar() {
            acertos = 0;
            erros = 0;
            acertosSpan.textContent = acertos;
            errosSpan.textContent = erros;
            gerarNovoProblema();
        }

        // --- 5. CONFIGURANDO OS EVENTOS DOS BOTÕES ---
        btnConferir.addEventListener('click', conferirResposta);
        btnNovo.addEventListener('click', gerarNovoProblema);
        btnReiniciar.addEventListener('click', reiniciarPlacar);

        respostaInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                conferirResposta();
            }
        });

        // --- 6. INICIANDO O JOGO ---
        gerarNovoProblema();
    </script>

</body>
</html>
