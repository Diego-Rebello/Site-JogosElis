<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contas de somar e subtrair em rodadas de dez, com níveis de dificuldade e apoio visual para treinar o cálculo mental.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Matemática — Jogos da Elis">
  <meta property="og:description" content="Contas de somar e subtrair em rodadas de dez, com níveis de dificuldade e apoio visual para treinar o cálculo mental.">
  <meta name="theme-color" content="#ff69b4">
  <title>Matemática</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../shared/icones/icone-192.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2290%22%3E%F0%9F%A7%AE%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="../../shared/base.css">
  <script defer src="../../shared/pwa.js"></script>
  <style>
    .matematica{max-width:640px;text-align:center}.tela[hidden]{display:none}.opcoes-escolha,.respostas{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}.escolha{min-height:64px}.escolha[aria-pressed="true"]{background:var(--cor-principal-escura);color:#fff}.progresso{width:100%;height:16px;accent-color:var(--cor-principal);margin:14px 0}.conta{font-size:clamp(2.5rem,13vw,4rem);color:var(--cor-texto-destaque);margin:16px 0}.apoio{font-size:clamp(1.2rem,6vw,2rem);line-height:1.5;overflow-wrap:anywhere;min-height:2em}.grade-pontos{display:inline-grid;gap:3px;font-size:.75rem;vertical-align:middle}.respostas .botao{font-size:1.5rem}.campo-resposta{max-width:180px;font-size:2rem;margin:0 auto 14px}.acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.resultado{font-size:1.2rem;line-height:1.6}
  </style>
</head>
<body class="pagina">
  <script src="../../shared/cabecalho.js" data-titulo="Matemática"></script>
  <main class="pagina__conteudo pagina__conteudo--centro"><section class="cartao matematica">
    <div id="tela-inicial" class="tela">
      <h1>🧮 Matemática</h1><p>Escolha seu desafio!</p>
      <div id="niveis" class="opcoes-escolha">
        <button class="botao botao--neutro escolha" data-nivel="1">1 — Contando</button><button class="botao botao--neutro escolha" data-nivel="2">2 — Até 20</button><button class="botao botao--neutro escolha" data-nivel="3">3 — Até 100</button><button class="botao botao--neutro escolha" data-nivel="4">4 — Tabuada</button><button class="botao botao--neutro escolha" data-nivel="5">5 — Desafio</button>
      </div>
      <p>Escolha a operação:</p><div id="operacoes" class="opcoes-escolha"></div><button id="iniciar" class="botao botao--sucesso">Começar!</button>
    </div>
    <div id="tela-jogo" class="tela" hidden>
      <div class="placar"><span class="placar__certo">✔️ <span id="acertos">0</span></span><span class="placar__errado">❌ <span id="erros">0</span></span><span>Questão <span id="atual">1</span>/10</span></div>
      <progress id="progresso" class="progresso" max="10" value="0">0 de 10</progress><div id="apoio" class="apoio" aria-hidden="true"></div><div id="conta" class="conta"></div><div id="respostas" class="respostas"></div>
      <label class="so-leitor" for="resposta">Sua resposta</label><input id="resposta" class="campo campo-resposta" type="number" inputmode="numeric" placeholder="?">
      <div class="acoes"><button id="conferir" class="botao botao--sucesso">Conferir</button><button id="proxima" class="botao" hidden>Próxima</button><button id="sair" class="botao botao--neutro">Trocar desafio</button></div><div id="feedback" class="feedback" aria-live="polite"></div>
    </div>
    <div id="tela-final" class="tela resultado" hidden><h2>🏆 Rodada concluída!</h2><p id="resumo"></p><p id="estrelas" aria-label="Estrelas conquistadas"></p><div class="acoes"><button id="jogar-novamente" class="botao botao--sucesso">Jogar de novo</button><button id="mudar" class="botao botao--neutro">Mudar desafio</button></div></div>
  </section></main>
  <script type="module">
    import { gerarOpcoes, gerarQuestao } from './jogo.js';
    import { tocar } from '../../shared/sons.js'; import { lancarConfete, animar } from '../../shared/confete.js'; import { calcularEstrelas, nomeDaCrianca, obterConfiguracoes, registrarPartida } from '../../shared/progresso.js';
    const $=id=>document.getElementById(id), telas=['tela-inicial','tela-jogo','tela-final'];
    const operacoesPorNivel={1:[['soma','Soma']],2:[['misto','Misturado'],['soma','Soma'],['subtracao','Subtração']],3:[['misto','Misturado'],['soma','Soma'],['subtracao','Subtração']],4:[['misto','Misturado'],['multiplicacao','Multiplicação'],['divisao','Divisão']],5:[['misto','Misturado'],['soma','Soma'],['subtracao','Subtração'],['multiplicacao','Multiplicação']]};
    let nivel=Number(obterConfiguracoes().niveis.matematica)||3,operacao='misto',questaoAtual,chaveAnterior='',respondida=false,indice=0,acertos=0,erros=0,inicio=0;
    function exibirTela(id){telas.forEach(tela=>$(tela).hidden=tela!==id)}
    function selecionarNivel(novo){nivel=Number(novo);document.querySelectorAll('[data-nivel]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.nivel)===nivel)));const permitidas=operacoesPorNivel[nivel];if(!permitidas.some(([id])=>id===operacao))operacao=permitidas[0][0];$('operacoes').innerHTML=permitidas.map(([id,nome])=>`<button class="botao botao--neutro escolha" data-operacao="${id}" aria-pressed="${id===operacao}">${nome}</button>`).join('');$('operacoes').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>selecionarOperacao(b.dataset.operacao)))}
    function selecionarOperacao(nova){operacao=nova;document.querySelectorAll('[data-operacao]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.operacao===operacao)))}
    function mostrarApoio(corrigir){const q=questaoAtual;if(nivel<=2){$('apoio').textContent=q.operacao==='soma'?`${'🍎'.repeat(q.numero1)} + ${'🍎'.repeat(q.numero2)}`:`${'🍎'.repeat(q.numero1)} − ${'🍎'.repeat(q.numero2)}`;$('apoio').hidden=nivel===2&&!corrigir}else if(nivel===4&&q.operacao==='multiplicacao'){$('apoio').innerHTML=`<span class="grade-pontos" style="grid-template-columns:repeat(${q.numero2},1fr)">${'<span>●</span>'.repeat(q.resposta)}</span>`;$('apoio').hidden=false}else{$('apoio').textContent='';$('apoio').hidden=true}}
    function novaQuestao(){do{questaoAtual=gerarQuestao(nivel,operacao)}while(questaoAtual.chave===chaveAnterior);chaveAnterior=questaoAtual.chave;respondida=false;$('atual').textContent=indice+1;$('progresso').value=indice;$('conta').textContent=`${questaoAtual.numero1} ${questaoAtual.simbolo} ${questaoAtual.numero2} =`;$('feedback').textContent='';$('feedback').className='feedback';$('proxima').hidden=true;$('conferir').hidden=false;$('resposta').value='';$('resposta').disabled=false;$('respostas').innerHTML='';$('resposta').hidden=nivel===1;if(nivel<=2)gerarOpcoes(questaoAtual.resposta).forEach(valor=>{const b=document.createElement('button');b.className='botao botao--neutro';b.textContent=valor;b.addEventListener('click',()=>conferir(valor));$('respostas').appendChild(b)});mostrarApoio(false);if(nivel>1)$('resposta').focus()}
    function conferir(valorInformado){if(respondida)return;if(valorInformado===undefined&&$('resposta').value.trim()===''){$('feedback').textContent='Digite uma resposta!';$('feedback').className='feedback feedback--errado';tocar('erro');return}const valor=valorInformado??Number($('resposta').value);respondida=true;const certo=Number(valor)===questaoAtual.resposta;if(certo){acertos++;$('feedback').textContent='🎉 Muito bem!';$('feedback').className='feedback feedback--certo';tocar('acerto');animar($('feedback'),'pular')}else{erros++;$('feedback').textContent=`A resposta certa é ${questaoAtual.resposta}.`;$('feedback').className='feedback feedback--errado';tocar('erro');animar($('feedback'),'tremer');mostrarApoio(true)}$('acertos').textContent=acertos;$('erros').textContent=erros;$('resposta').disabled=true;$('respostas').querySelectorAll('button').forEach(b=>b.disabled=true);$('conferir').hidden=true;$('proxima').hidden=false;$('proxima').textContent=indice===9?'Ver resultado':'Próxima';$('proxima').focus()}
    function avancar(){if(!respondida)return;indice++;$('progresso').value=indice;indice>=10?finalizar():novaQuestao()}
    function iniciarRodada(){indice=0;acertos=0;erros=0;chaveAnterior='';inicio=Date.now();$('acertos').textContent='0';$('erros').textContent='0';exibirTela('tela-jogo');novaQuestao()}
    function finalizar(){const segundos=Math.max(1,Math.round((Date.now()-inicio)/1000)),estrelas=calcularEstrelas(acertos,erros);registrarPartida('matematica',{acertos,erros,estrelas});$('resumo').textContent=`Parabéns, ${nomeDaCrianca()}! Você acertou ${acertos} de 10 em ${segundos} segundos.`;$('estrelas').textContent='⭐'.repeat(estrelas);exibirTela('tela-final');tocar('vitoria');lancarConfete()}
    document.querySelectorAll('[data-nivel]').forEach(b=>b.addEventListener('click',()=>selecionarNivel(b.dataset.nivel)));$('iniciar').addEventListener('click',()=>{tocar('clique');iniciarRodada()});$('conferir').addEventListener('click',()=>conferir());$('proxima').addEventListener('click',avancar);$('sair').addEventListener('click',()=>exibirTela('tela-inicial'));$('jogar-novamente').addEventListener('click',iniciarRodada);$('mudar').addEventListener('click',()=>exibirTela('tela-inicial'));$('resposta').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();respondida?avancar():conferir()}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&respondida&&!$('tela-jogo').hidden){e.preventDefault();avancar()}});selecionarNivel(nivel);
  </script>
</body></html>
