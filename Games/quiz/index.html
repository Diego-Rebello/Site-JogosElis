<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Quiz de conhecimentos gerais com ciências, animais, Brasil, corpo humano e planetas."><meta property="og:title" content="Quiz Sabe-Tudo — Jogos da Elis"><meta property="og:description" content="Dez perguntas com explicações para aprender brincando."><meta name="theme-color" content="#ff69b4"><title>Quiz Sabe-Tudo</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icones/icone-192.png"><link rel="stylesheet" href="../../shared/base.css"><script type="module" src="../../shared/pwa.js"></script><style>
.jogo{max-width:720px;text-align:center}.tela[hidden]{display:none}.categorias{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px;margin:18px 0}.categoria[aria-pressed=true]{background:var(--cor-principal-profunda);color:#fff}.emoji{font-size:3.2rem}.pergunta{font:700 clamp(1.25rem,5vw,1.7rem) var(--fonte-leitura);line-height:1.35}.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opcao{min-height:68px;padding:10px;font-family:var(--fonte-leitura)}.explicacao{font-family:var(--fonte-leitura);background:#fff6c9;border-radius:12px;padding:12px;min-height:3em}.progresso{width:100%;height:14px;accent-color:var(--cor-principal)}.acoes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}@media(max-width:500px){.jogo{padding:15px 9px}.opcoes{grid-template-columns:1fr}.opcao{min-height:56px}}.botao.opcao{min-height:68px;padding:10px;font-family:var(--fonte-leitura)}.botao.opcao.botao--sucesso:disabled{background:var(--cor-certo);color:#fff}
</style></head><body class="pagina"><main class="pagina__conteudo pagina__conteudo--centro"><div class="cartao jogo"><section id="inicio" class="tela"><h2>🧠 QUIZ SABE-TUDO</h2><p>Escolha uma categoria para responder 10 perguntas.</p><div id="categorias" class="categorias"></div><button id="comecar" class="botao botao--sucesso">COMEÇAR</button></section><section id="partida" class="tela" hidden><div class="placar"><span class="placar__certo">ACERTOS: <span id="acertos">0</span></span><span class="placar__errado">ERROS: <span id="erros">0</span></span><span>PERGUNTA: <span id="atual">1</span>/10</span></div><progress id="progresso" class="progresso" max="10" value="0"></progress><div id="emoji" class="emoji"></div><p id="pergunta" class="pergunta"></p><div id="opcoes" class="opcoes"></div><div id="feedback" class="feedback" aria-live="polite"></div><p id="explicacao" class="explicacao" hidden></p><div class="acoes"><button id="proxima" class="botao" hidden>PRÓXIMA</button><button id="sair" class="botao botao--neutro">TROCAR CATEGORIA</button></div></section><section id="final" class="tela" hidden><h2>🏆 QUIZ CONCLUÍDO!</h2><p id="resumo"></p><p id="estrelas" style="font-size:2rem"></p><div class="acoes"><button id="de-novo" class="botao botao--sucesso">JOGAR DE NOVO</button><button id="trocar" class="botao botao--neutro">TROCAR CATEGORIA</button></div></section></div></main><script type="module" src="./tela.js"></script></body></html>
