<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Complete o Sudoku de emojis sem repetir símbolos nas linhas, colunas e blocos."><meta property="og:title" content="Sudoku de Emojis — Jogos da Elis"><meta property="og:description" content="Sudoku 4×4, 6×6 ou 9×9 para treinar lógica."><meta name="theme-color" content="#ff69b4"><title>Sudoku de Emojis</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icones/icone-192.png"><link rel="stylesheet" href="../../shared/base.css"><script type="module" src="../../shared/pwa.js"></script><style>
.jogo{max-width:680px;text-align:center}.tela[hidden]{display:none}.niveis{display:grid;gap:12px;margin:18px 0}.nivel[aria-pressed=true]{background:var(--cor-principal-profunda);color:#fff}.tabuleiro{display:grid;width:min(94vw,570px);aspect-ratio:1;margin:12px auto;border:4px solid var(--cor-texto);background:var(--cor-texto)}.celula{display:grid;place-items:center;min-width:0;padding:0;border:1px solid #d9b4c4;background:#fff;font:700 clamp(1rem,5vw,2rem) var(--fonte-leitura);color:var(--cor-texto);cursor:pointer}.celula.fixa{background:#f7eaf0;color:#70425a}.celula.ativa{background:#fff0a8}.celula.conflito{box-shadow:inset 0 0 0 3px var(--cor-errado);background:#ffe6e6}.paleta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}.valor{min-width:48px;min-height:48px;padding:8px;font-size:1.45rem}.acoes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.status{font-family:var(--fonte-leitura);min-height:1.5em}.bloco-direita{border-right-width:4px}.bloco-baixo{border-bottom-width:4px}@media(max-width:390px){.pagina__conteudo{padding-left:6px;padding-right:6px}.jogo{padding:14px 6px}.tabuleiro{width:calc(100% + 8px);margin-left:-4px}.celula{font-size:clamp(.92rem,5.5vw,1.5rem)}}
</style></head><body class="pagina"><main class="pagina__conteudo pagina__conteudo--centro"><div class="cartao jogo"><section id="inicio" class="tela"><h2>🧩 SUDOKU DE EMOJIS</h2><p>Não repita símbolos na mesma linha, coluna ou bloco.</p><div id="niveis" class="niveis"></div><button id="comecar" class="botao botao--sucesso">COMEÇAR</button></section><section id="partida" class="tela" hidden><div class="placar"><span>⏱️ <span id="tempo">0:00</span></span><span>DICAS: <span id="dicas">0</span></span></div><div id="tabuleiro" class="tabuleiro" role="grid" aria-label="Tabuleiro de Sudoku"></div><div id="paleta" class="paleta" aria-label="Escolha um símbolo"></div><p id="status" class="status" aria-live="polite">Escolha uma célula vazia.</p><div class="acoes"><button id="dica" class="botao">💡 DICA</button><button id="limpar" class="botao botao--neutro">APAGAR</button><button id="sair" class="botao botao--neutro">TROCAR NÍVEL</button></div></section><section id="final" class="tela" hidden><h2>🏆 SUDOKU COMPLETO!</h2><p id="resumo"></p><p id="estrelas" style="font-size:2rem"></p><div class="acoes"><button id="de-novo" class="botao botao--sucesso">NOVO SUDOKU</button><button id="trocar" class="botao botao--neutro">TROCAR NÍVEL</button></div></section></div></main><script type="module" src="./tela.js"></script></body></html>
