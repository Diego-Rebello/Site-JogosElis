<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Bem-vinda aos Jogos da Elis! ✨</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%220.9em%22%20font-size%3D%2290%22%3E%E2%9C%A8%3C%2Ftext%3E%3C%2Fsvg%3E">
    <!-- Importando a biblioteca de ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="shared/base.css">
    <style>
        /* Tokens, fontes e reset vêm do shared/base.css.
           Aqui fica só o que é da página inicial. */
        .container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .topo {
            padding: 24px 12px 8px;
        }

        .topo h1 {
            font-family: var(--fonte-titulo);
            font-weight: 400;
            font-size: clamp(2.2rem, 11vw, 3.5rem);
            color: var(--cor-principal);
            text-shadow: 3px 3px 0px var(--cor-destaque);
            margin: 0;
        }

        .topo p {
            font-size: clamp(1rem, 4vw, 1.2rem);
            margin-top: 10px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            margin-top: 28px;
        }

        /* Cada jogo é um .cartao que também é link. */
        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 30px 20px;
            text-decoration: none;
            color: var(--cor-principal-escura);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.05);
        }

        /* O seletor `i` some junto com o Font Awesome na T11; o .icone fica. */
        .game-card i,
        .game-card .icone {
            font-size: 3.5rem;
            line-height: 1;
        }

        .game-card span:not(.icone) {
            font-size: 1.35rem;
        }

        .rodape {
            margin-top: 50px;
            padding-bottom: 20px;
            color: var(--cor-suave);
            font-family: var(--fonte-leitura);
        }
    </style>
</head>
<body class="pagina">

    <div class="pagina__conteudo">
        <div class="container">
            <div class="topo">
                <h1>Jogos da Elis</h1>
                <p>Um mundo de diversão e aprendizado espera por você!</p>
            </div>

            <main>
                <div class="games-grid">
                    <a href="Games/forca/index.html" class="cartao game-card">
                        <i class="fa-solid fa-ghost"></i>
                        <span>Jogo da Forca</span>
                    </a>

                    <a href="Games/memoria/dist/index.html" class="cartao game-card">
                        <i class="fa-solid fa-brain"></i>
                        <span>Jogo da Memória</span>
                    </a>

                    <a href="Games/matematica/index.html" class="cartao game-card">
                        <i class="fa-solid fa-calculator"></i>
                        <span>Jogo de Somar</span>
                    </a>

                    <a href="Games/m-ou-n/index.html" class="cartao game-card">
                        <i class="fa-solid fa-keyboard"></i>
                        <span>Jogo do M ou N</span>
                    </a>

                    <a href="Games/velha/dist/index.html" class="cartao game-card">
                        <i class="fa-solid fa-chess"></i>
                        <span>Jogo da Velha</span>
                    </a>
                </div>
            </main>

            <div class="rodape">
                <p>Feito com ❤️ para a Elis se divertir!</p>
            </div>
        </div>
    </div>

</body>
</html>
