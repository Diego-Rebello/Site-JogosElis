<!DOCTYPE html>
<html lang="pt-BR" class="tema-rael">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mire, espere o goleiro sair do caminho e chute. Cinco pênaltis nos Jogos do Rael.">
  <meta name="theme-color" content="#0f5aa8">
  <title>Chute a Gol — Jogos do Rael</title>
  <link rel="manifest" href="/rael.webmanifest">
  <link rel="apple-touch-icon" href="/icones/rael-192.png">
  <link rel="icon" href="/icones/rael.svg">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/tema-rael.css">
  <link rel="stylesheet" href="../../shared/descobertas.css">
  <link rel="stylesheet" href="./chute-a-gol.css">
  <script type="module" src="../../shared/pwa.js"></script>
</head>
<body class="pagina">
  <svg class="icones-modo-defs" aria-hidden="true" focusable="false" width="0" height="0">
    <symbol id="icone-chuteira" viewBox="0 0 64 48">
      <!-- Chuteira rubro-negra vista de lado, bico para a direita -->
      <path d="M11 13 Q11 9 16 9 L25 9 Q30 9 31 14 L33 21 Q44 23 52 27 Q59 31 59 35 L59 36 Q59 38 56 38 L12 38 Q9 38 9 35 Z" fill="#c8102e" stroke="#111111" stroke-width="2.4" stroke-linejoin="round" />
      <path d="M33 25 Q43 27 53 32" stroke="#111111" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M34 22 L31 29 M40 24 L37 31 M46 27 L43 33" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
      <path d="M12 14 L12 34" stroke="#111111" stroke-width="2" stroke-linecap="round" />
      <path d="M8 36 L59 36 Q62 36 62 39 L62 40 Q62 43 58 43 L11 43 Q8 43 8 40 Z" fill="#111111" />
      <circle cx="15" cy="45" r="2.3" fill="#111111" />
      <circle cx="29" cy="45" r="2.3" fill="#111111" />
      <circle cx="43" cy="45" r="2.3" fill="#111111" />
      <circle cx="56" cy="45" r="2.3" fill="#111111" />
    </symbol>
    <symbol id="icone-luva" viewBox="0 0 48 56">
      <!-- Luva de goleiro laranja -->
      <path d="M9 24 L9 14 Q9 10 13 10 Q17 10 17 14 L17 22" fill="#ff9100" stroke="#111111" stroke-width="2.2" stroke-linejoin="round" />
      <path d="M17 22 L17 9 Q17 5 21 5 Q25 5 25 9 L25 21" fill="#ff9100" stroke="#111111" stroke-width="2.2" stroke-linejoin="round" />
      <path d="M25 21 L25 8 Q25 4 29 4 Q33 4 33 8 L33 22" fill="#ff9100" stroke="#111111" stroke-width="2.2" stroke-linejoin="round" />
      <path d="M33 22 L33 11 Q33 7 37 7 Q41 7 41 11 L41 26" fill="#ff9100" stroke="#111111" stroke-width="2.2" stroke-linejoin="round" />
      <path d="M9 22 Q5 22 5 27 Q5 31 9 32 L9 38 Q9 48 20 48 L31 48 Q41 48 41 38 L41 24 Q41 21 37 21 L11 21 Z" fill="#ff9100" stroke="#111111" stroke-width="2.2" stroke-linejoin="round" />
      <path d="M11 44 L39 44 L39 50 Q39 53 35 53 L15 53 Q11 53 11 50 Z" fill="#111111" />
      <ellipse cx="25" cy="34" rx="8" ry="6" fill="#ffd000" stroke="#111111" stroke-width="1.6" />
    </symbol>
  </svg>
  <main class="pagina__conteudo pagina__conteudo--centro">
    <section class="cartao descobertas">
      <div class="tela convite" id="tela-convite">
        <div class="figuras-convite" aria-hidden="true">
          <div class="convite__furacao-faixa">
            <span class="furacao-faixa-vento"></span>
            <span class="furacao-faixa-vento"></span>
            <span class="furacao-faixa-vento"></span>
            <span class="furacao-faixa-vento"></span>
          </div>
          <img class="convite__figura" src="/figuras/bola.svg" alt="" width="110" height="110">
        </div>
        <h2 class="instrucao__texto">Chute a Gol do Furacão</h2>
        <p class="convite__texto">Mire com as setas, vença o goleiro e faça a festa no Caldeirão!</p>
        <button class="botao botao--gigante botao--furacao" id="comecar" type="button">▶ Vamos brincar</button>
        <p class="convite__texto" id="aviso-voz" hidden></p>
      </div>

      <div class="tela" id="tela-modo" hidden>
        <h2 class="instrucao__texto">Como você quer jogar?</h2>
        <p class="convite__texto">Toque no seu jeito de brincar.</p>
        <div class="modos">
          <button class="botao modo" id="modo-chutar" type="button" data-modo="chutar">
            <span class="modo__icones" aria-hidden="true">
              <svg class="modo__icone" viewBox="0 0 64 48"><use href="#icone-chuteira" /></svg>
            </span>
            <span class="modo__nome">Chutar</span>
            <span class="modo__dica">Você bate os pênaltis</span>
          </button>
          <button class="botao modo" id="modo-defender" type="button" data-modo="defender">
            <span class="modo__icones" aria-hidden="true">
              <svg class="modo__icone modo__icone--luva" viewBox="0 0 48 56"><use href="#icone-luva" /></svg>
            </span>
            <span class="modo__nome">Defender</span>
            <span class="modo__dica">Você é o goleiro</span>
          </button>
          <button class="botao modo" id="modo-alternado" type="button" data-modo="alternado">
            <span class="modo__icones" aria-hidden="true">
              <svg class="modo__icone modo__icone--par" viewBox="0 0 64 48"><use href="#icone-chuteira" /></svg>
              <svg class="modo__icone modo__icone--par modo__icone--luva" viewBox="0 0 48 56"><use href="#icone-luva" /></svg>
            </span>
            <span class="modo__nome">Alternado</span>
            <span class="modo__dica">Um chute, uma defesa</span>
          </button>
        </div>
      </div>

      <div class="tela" id="tela-brincadeira" hidden>
        <div class="marcador">
          <span class="marcador__item" id="chute-atual">Pênalti 1 de 5</span>
          <span class="marcador__item marcador__papel" id="papel-atual"></span>
          <span class="marcador__item" id="placar" role="img" aria-label="Placar da rodada"></span>
        </div>

        <!-- Campo temático do Caldeirão do Furacão -->
        <div id="field">
          <div class="estadio-painel" aria-hidden="true">
            <div class="estadio-ventos">
              <span></span><span></span><span></span><span></span>
            </div>
            <span class="estadio-letreiro">★ CALDEIRÃO DO FURACÃO ★</span>
            <div class="estadio-ventos estadio-ventos--invertido">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>

          <div id="goalpost">🥅</div>

          <!-- Linhas oficiais do campo do Caldeirão -->
          <div class="campo-linhas" aria-hidden="true">
            <div class="campo-grande-area"></div>
            <div class="campo-meia-lua"></div>
            <div class="campo-pequena-area"></div>
            <div class="campo-ponto-penalti"></div>
          </div>

          <div class="goal-line" id="goal-line-top"></div>
          <div class="goal-line" id="goal-line-bottom"></div>

          <!-- Linha tracejada de mira angular -->
          <svg id="guia-mira" class="guia-mira" aria-hidden="true">
            <line id="mira-linha" x1="0" y1="0" x2="0" y2="0" />
            <circle id="mira-alvo" cx="0" cy="0" r="7" />
          </svg>

          <div id="goalkeeper" aria-label="Goleiro">
            <svg class="goleiro-svg" viewBox="0 0 54 56" width="54" height="56" xmlns="http://www.w3.org/2000/svg">
              <!-- Chuteiras -->
              <ellipse cx="20" cy="53" rx="4.5" ry="2.5" fill="#111111" />
              <ellipse cx="34" cy="53" rx="4.5" ry="2.5" fill="#111111" />

              <!-- Meião do Goleiro (amarelo com listra preta) -->
              <rect x="18" y="42" width="5" height="10" rx="2" fill="#ffd000" />
              <rect x="18" y="45" width="5" height="2.5" fill="#111111" />
              <rect x="31" y="42" width="5" height="10" rx="2" fill="#ffd000" />
              <rect x="31" y="45" width="5" height="2.5" fill="#111111" />

              <!-- Calção de Goleiro Preto com friso amarelo -->
              <path d="M16 33 L38 33 L36 43 L29 43 L27 38 L25 43 L18 43 Z" fill="#1a1a24" />
              <line x1="17" y1="38" x2="37" y2="38" stroke="#ffd000" stroke-width="1.2" />

              <!-- Tronco / Camisa Amarela de Goleiro -->
              <path d="M16 20 L38 20 L39 34 L15 34 Z" fill="#ffd000" />
              <path d="M23 20 L27 24 L31 20 Z" fill="#111111" />
              <path d="M16 20 L19 34 L16 34 Z" fill="#111111" />
              <path d="M38 20 L35 34 L38 34 Z" fill="#111111" />
              <text x="27" y="30" font-size="7.5" font-weight="900" fill="#111111" text-anchor="middle" font-family="sans-serif">1</text>

              <!-- Braço Esquerdo em posição de defesa com Luva -->
              <path d="M16 22 L9 26 L8 31" stroke="#ffd000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              <circle cx="8" cy="31" r="2.2" fill="#f5b895" />
              <g class="goleiro-luva-esq">
                <ellipse cx="6" cy="31" rx="5.5" ry="6.5" fill="#ff9100" stroke="#111111" stroke-width="1.2" />
                <path d="M4 27 Q6 25 8 27" stroke="#111111" stroke-width="1" fill="none" />
                <ellipse cx="4" cy="27" rx="1.8" ry="2.5" fill="#ffd000" stroke="#111111" stroke-width="0.8" />
                <rect x="4" y="34" width="5" height="3" rx="1" fill="#111111" />
              </g>

              <!-- Braço Direito em posição de defesa com Luva -->
              <path d="M38 22 L45 26 L46 31" stroke="#ffd000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              <circle cx="46" cy="31" r="2.2" fill="#f5b895" />
              <g class="goleiro-luva-dir">
                <ellipse cx="48" cy="31" rx="5.5" ry="6.5" fill="#ff9100" stroke="#111111" stroke-width="1.2" />
                <path d="M46 27 Q48 25 50 27" stroke="#111111" stroke-width="1" fill="none" />
                <ellipse cx="50" cy="27" rx="1.8" ry="2.5" fill="#ffd000" stroke="#111111" stroke-width="0.8" />
                <rect x="45" y="34" width="5" height="3" rx="1" fill="#111111" />
              </g>

              <!-- Pescoço -->
              <rect x="25" y="17" width="4" height="4" fill="#f5b895" />

              <!-- Cabeça / Rosto do Goleiro -->
              <circle cx="27" cy="12" r="7.5" fill="#f5b895" />
              <path d="M19.5 11 C19.5 5.5, 34.5 5.5, 34.5 11 C32.5 10, 30 9.2, 27 9.2 C23 9.2, 21 10, 19.5 11 Z" fill="#2d1a0e" />
              <path d="M20 11 Q22 6.5 27 6.5 Q32 6.5 34 11" fill="#2d1a0e" />
              <circle cx="24.5" cy="12" r="1.3" fill="#111111" />
              <circle cx="29.5" cy="12" r="1.3" fill="#111111" />
              <circle cx="24.8" cy="11.7" r="0.4" fill="#ffffff" />
              <circle cx="29.8" cy="11.7" r="0.4" fill="#ffffff" />
              <line x1="23" y1="9.8" x2="26" y2="10.4" stroke="#2d1a0e" stroke-width="0.9" stroke-linecap="round" />
              <line x1="31" y1="9.8" x2="28" y2="10.4" stroke="#2d1a0e" stroke-width="0.9" stroke-linecap="round" />
              <path d="M24.5 15 Q27 17.2 29.5 15" stroke="#c8102e" stroke-width="1.1" stroke-linecap="round" fill="none" />
            </svg>
          </div>

          <div id="football">⚽</div>

          <div id="striker" aria-label="Rael jogando pelo Athletico">
            <svg class="jogador-svg" viewBox="0 0 48 64" width="48" height="64" xmlns="http://www.w3.org/2000/svg">
              <!-- Pernas / Meião Rubro-Negro -->
              <g class="jogador-pernas">
                <rect class="uniforme" x="16" y="44" width="6" height="12" rx="3" fill="#c8102e" />
                <rect x="16" y="48" width="6" height="3" fill="#111111" />
                <ellipse cx="18" cy="58" rx="5" ry="3" fill="#111111" />
                <rect class="uniforme" x="26" y="44" width="6" height="12" rx="3" fill="#c8102e" />
                <rect x="26" y="48" width="6" height="3" fill="#111111" />
                <ellipse cx="30" cy="58" rx="5" ry="3" fill="#111111" />
              </g>
              <!-- Calção Preto do Furacão -->
              <path d="M14 36 L34 36 L32 46 L25 46 L24 42 L23 46 L16 46 Z" fill="#111111" />
              <line class="uniforme-traco" x1="14" y1="41" x2="34" y2="41" stroke="#c8102e" stroke-width="1.2" />
              <!-- Camisa Rubro-Negra do Furacão -->
              <path class="uniforme" d="M13 22 L35 22 L37 38 L11 38 Z" fill="#c8102e" />
              <!-- 4 faixas diagonais do Athletico (quatro ventos) -->
              <path d="M13 36 L21 24" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
              <path d="M18 37 L26 24" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
              <path d="M23 37 L31 24" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
              <path d="M28 37 L34 27" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
              <!-- Escudinho CAP no peito -->
              <circle cx="17" cy="27" r="2.2" fill="#ffffff" />
              <circle class="uniforme" cx="17" cy="27" r="1.5" fill="#c8102e" />
              <!-- Braços -->
              <rect x="8" y="23" width="5" height="12" rx="2.5" fill="#f5b895" />
              <rect x="35" y="23" width="5" height="12" rx="2.5" fill="#f5b895" />
              <rect class="uniforme" x="9" y="22" width="5" height="5" rx="2" fill="#c8102e" />
              <rect class="uniforme" x="34" y="22" width="5" height="5" rx="2" fill="#c8102e" />
              <!-- Cabeça e Rosto do Rael -->
              <circle cx="24" cy="13" r="9" fill="#f5b895" />
              <path d="M15 12 C15 6, 33 6, 33 12 C31 11, 29 10, 24 10 C19 10, 17 11, 15 12 Z" fill="#3d2314" />
              <path d="M15 12 Q14 8 20 6 Q28 6 33 10 Q28 8 23 8 Q17 8 15 12" fill="#3d2314" />
              <circle cx="21" cy="13" r="1.3" fill="#111111" />
              <circle cx="27" cy="13" r="1.3" fill="#111111" />
              <path d="M21 16 Q24 19 27 16" stroke="#c8102e" stroke-width="1.2" stroke-linecap="round" fill="none" />
            </svg>
          </div>

          <!-- Mascote Fura-Cão torcendo na lateral -->
          <div id="mascote-furacao" class="mascote-furacao" aria-hidden="true" title="Fura-Cão torcendo!">
            <svg class="mascote-svg" viewBox="0 0 64 68" width="56" height="60" xmlns="http://www.w3.org/2000/svg">
              <path class="mascote-rabo" d="M14 46 Q6 40 10 32" stroke="#d48238" stroke-width="5" stroke-linecap="round" fill="none" />
              <ellipse cx="28" cy="46" rx="14" ry="12" fill="#e8974d" />
              <path d="M16 42 Q28 36 40 42 L38 54 Q28 56 18 54 Z" fill="#c8102e" />
              <line x1="22" y1="41" x2="28" y2="54" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
              <line x1="28" y1="40" x2="34" y2="53" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
              <text x="23" y="50" font-size="7" font-weight="900" fill="#ffffff" font-family="sans-serif">49</text>
              <ellipse cx="22" cy="56" rx="4" ry="3" fill="#d48238" />
              <ellipse cx="34" cy="56" rx="4" ry="3" fill="#d48238" />
              <circle cx="32" cy="24" r="13" fill="#e8974d" />
              <path class="mascote-orelha" d="M21 16 Q14 20 16 30 Q21 28 23 20 Z" fill="#9e561c" />
              <path class="mascote-orelha" d="M43 16 Q50 20 48 30 Q43 28 41 20 Z" fill="#9e561c" />
              <ellipse cx="32" cy="27" rx="6" ry="4.5" fill="#fdf0e0" />
              <ellipse cx="32" cy="25" rx="2.5" ry="1.8" fill="#111111" />
              <path d="M30 28 Q32 30 34 28" stroke="#111111" stroke-width="1" fill="none" />
              <path d="M31 29 Q32 33 33 29 Z" fill="#ff4d6d" />
              <circle cx="27" cy="21" r="2.2" fill="#111111" />
              <circle cx="26.3" cy="20.3" r="0.8" fill="#ffffff" />
              <circle cx="37" cy="21" r="2.2" fill="#111111" />
              <circle cx="36.3" cy="20.3" r="0.8" fill="#ffffff" />
              <g class="mascote-bandeira">
                <line x1="42" y1="48" x2="56" y2="10" stroke="#8d6e63" stroke-width="2" stroke-linecap="round" />
                <polygon points="56,12 58,26 47,20" fill="#c8102e" />
                <polygon points="56,12 51,17 47,20" fill="#111111" />
              </g>
            </svg>
            <span class="mascote-nome">FURA-CÃO</span>
          </div>

          <div id="goal-message" aria-live="polite"></div>
        </div>

        <div class="controles">
          <button class="botao botao--seta" id="esquerda" type="button" aria-label="Mirar para a esquerda">◀</button>
          <button class="botao botao--chutar botao--furacao" id="chutar" type="button">CHUTAR</button>
          <button class="botao botao--seta" id="direita" type="button" aria-label="Mirar para a direita">▶</button>
        </div>
        <p class="controles__dica" id="dica-controles"></p>
      </div>

      <div class="tela conclusao" id="tela-fim" hidden>
        <h2 class="instrucao__texto" id="titulo-fim">Festa no Caldeirão!</h2>
        <p class="placar-fim" id="placar-fim" role="img" aria-label="Placar da disputa">
          <span class="placar-fim__lado">
            <span class="placar-fim__time">Você</span>
            <span class="placar-fim__pontos" id="placar-fim-jogador">0</span>
          </span>
          <span class="placar-fim__x" aria-hidden="true">×</span>
          <span class="placar-fim__lado">
            <span class="placar-fim__pontos placar-fim__pontos--rival" id="placar-fim-adversario">0</span>
            <span class="placar-fim__time" id="placar-fim-rival">Adversário</span>
          </span>
        </p>
        <p class="placar-fim__desfecho" id="desfecho-fim"></p>
        <div class="bolas-fim" id="bolas-fim" aria-hidden="true"></div>
        <img class="conclusao__figurinha" id="figurinha" src="" alt="" width="150" height="150">
        <p class="convite__texto" id="texto-fim"></p>
        <div class="conclusao__acoes">
          <button class="botao botao--gigante" id="de-novo" type="button">🔁 Brincar de novo</button>
          <a class="botao botao--secundario" href="../index.html">🏠 Voltar</a>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./tela.js"></script>
</body>
</html>
