<!DOCTYPE html>
<html lang="pt-BR" class="tema-rael">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore labirintos grandes, encontre o caminho e leve o carrinho até a garagem. Brincadeira dos Jogos do Rael para tablet e computador.">
  <meta name="theme-color" content="#0f5aa8">
  <title>Meu Primeiro Labirinto — Jogos do Rael</title>
  <link rel="manifest" href="/rael.webmanifest">
  <link rel="apple-touch-icon" href="/icones/rael-192.png">
  <link rel="icon" href="/icones/rael.svg">
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/tema-rael.css">
  <link rel="stylesheet" href="../../shared/descobertas.css">
  <link rel="stylesheet" href="./labirinto.css">
  <script type="module" src="../../shared/pwa.js"></script>
</head>
<body class="pagina">
  <main class="pagina__conteudo pagina__conteudo--centro">
    <section class="cartao descobertas labirinto-jogo">
      <div class="tela convite" id="tela-convite">
        <div class="figuras-convite" aria-hidden="true">
          <img class="convite__figura" src="/figuras/carro.svg" alt="" width="110" height="110">
          <span class="sinal-grande">➜</span>
          <img class="convite__figura" src="/figuras/casa.svg" alt="" width="110" height="110">
        </div>
        <h2 class="instrucao__texto">Meu Primeiro Labirinto</h2>
        <p class="convite__texto">Explore caminhos, use as figuras e leve o carrinho até a garagem.</p>
        <button class="botao botao--gigante botao--comecar" id="comecar" type="button" aria-label="Começar o labirinto">
          <img src="/figuras/carro.svg" alt="" aria-hidden="true"> ▶
        </button>
        <p class="convite__texto" id="aviso-voz" hidden></p>
      </div>

      <div class="tela" id="tela-brincadeira" hidden>
        <div class="instrucao instrucao--labirinto">
          <p class="instrucao__texto" id="instrucao">Leve o carrinho até a garagem!</p>
          <button class="botao botao--repetir" id="repetir" type="button">🔊 Ouvir</button>
        </div>
        <div class="status-labirinto" aria-live="polite">
          <span id="nivel"></span>
        </div>
        <div class="objetivos" id="objetivos" aria-label="Objetivos do caminho"></div>
        <div class="area-labirinto">
          <div class="mapa-jogavel">
            <div class="barra-mapa" aria-label="Controles de visualização do mapa">
              <button class="botao-mapa" id="diminuir" type="button" aria-label="Ver mais casas">−</button>
              <button class="botao-mapa botao-mapa--visao" id="ver-mapa" type="button" aria-label="Ver o mapa inteiro">🗺️</button>
              <button class="botao-mapa" id="ampliar" type="button" aria-label="Ampliar as casas">＋</button>
              <button class="botao-mapa" id="voltar-carrinho" type="button" aria-label="Voltar a visão para o carrinho">🚗</button>
              <button class="botao-mapa" id="ajuda" type="button" aria-label="Ver como usar os obstáculos">❓</button>
            </div>
            <div class="janela-tabuleiro" id="janela-tabuleiro">
              <div class="tabuleiro" id="tabuleiro" role="grid" aria-label="Labirinto"></div>
            </div>
          </div>
          <aside class="painel-labirinto" aria-label="Controles do labirinto">
            <p class="feedback retorno retorno--labirinto" id="retorno" aria-live="polite"></p>
            <p class="atalho-teclado">Use as setas do teclado ou os botões.</p>
            <div class="controles" aria-label="Setas para mover o carrinho">
              <button class="controle controle--cima" type="button" data-direcao="cima" aria-label="Mover para cima">▲</button>
              <button class="controle controle--esquerda" type="button" data-direcao="esquerda" aria-label="Mover para a esquerda">◀</button>
              <button class="controle controle--baixo" type="button" data-direcao="baixo" aria-label="Mover para baixo">▼</button>
              <button class="controle controle--direita" type="button" data-direcao="direita" aria-label="Mover para a direita">▶</button>
            </div>
            <button class="acao-contextual" id="acao-contextual" type="button" hidden></button>
            <div class="acoes-labirinto">
              <button class="botao botao--secundario" id="dica" type="button" aria-label="Pedir uma dica">💡 <span>Dica</span></button>
              <button class="botao botao--neutro" id="recomecar" type="button" aria-label="Recomeçar este mapa">↩ <span>Recomeçar</span></button>
              <button class="botao botao--neutro" id="outro-mapa" type="button" aria-label="Trocar de mapa">🔄 <span>Outro mapa</span></button>
            </div>
          </aside>
        </div>
        <div class="roteiro" id="roteiro" hidden>
          <span class="roteiro__titulo">Para o adulto ler em voz alta</span>
          <span class="roteiro__fala" id="roteiro-fala"></span>
        </div>
      </div>

      <div class="tela conclusao" id="tela-fim" hidden>
        <h2 class="instrucao__texto">Chegou à garagem!</h2>
        <img class="conclusao__figurinha" id="figurinha" src="" alt="" width="150" height="150">
        <p class="convite__texto" id="texto-fim"></p>
        <div class="conclusao__acoes">
          <button class="botao botao--gigante" id="de-novo" type="button">🔁 Outro caminho</button>
          <a class="botao botao--secundario" href="../index.html">🏠 Voltar</a>
        </div>
      </div>
    </section>

    <dialog class="dialogo-mapa" id="mapa-geral" aria-labelledby="titulo-mapa-geral">
      <div class="dialogo__topo">
        <strong id="titulo-mapa-geral">🗺️ Mapa inteiro</strong>
        <button class="fechar-dialogo" id="fechar-mapa" type="button" aria-label="Fechar o mapa e voltar ao carrinho">🚗</button>
      </div>
      <div class="tabuleiro-geral" id="tabuleiro-geral" role="img" aria-label="Visão geral do labirinto"></div>
    </dialog>

    <dialog class="dialogo-ajuda" id="demonstracao" aria-labelledby="titulo-demonstracao">
      <h2 id="titulo-demonstracao">Veja e experimente</h2>
      <div class="demonstracao-visual" id="demonstracao-visual" aria-live="polite"></div>
      <div class="dialogo__acoes">
        <button class="botao botao--repetir" id="ouvir-demo" type="button" aria-label="Ouvir a explicação de novo">🔊</button>
        <button class="botao botao--gigante botao--seguir" id="fechar-demo" type="button" aria-label="Entendi, começar a jogar">
          <img src="/figuras/carro.svg" alt="" aria-hidden="true"> ▶
        </button>
      </div>
    </dialog>
  </main>
  <script type="module" src="./tela.js"></script>
</body>
</html>
